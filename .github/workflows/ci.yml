name: Enterprise CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Show Runner Information
        run: |
          pwd
          whoami
          docker --version
          php --version

      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build -t jeevanrana78/enterprise-inventory-app:latest .

      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect jeevanrana78/enterprise-inventory-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push jeevanrana78/enterprise-inventory-app:latest
     
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jeevanrana78/enterprise-inventory-app:latest
          format: table
          exit-code: 0
          
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: quickview
          image: jeevanrana78/enterprise-inventory-app:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: jeevanrana78/enterprise-inventory-app:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json