

name: Enterprise CI Pipeline

on:
  push:

# ==========================================================
# Code Quality
# - SonarQube Static Code Analysis
# - Sonar Quality Gate
# ==========================================================
jobs:
  sonarqube:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
    
     - name: Show Working Directory
        shell: powershell
        run: |
          pwd
          dir

      - name: SonarQube Scan
        shell: powershell
        run: |
          & "C:\Tools\sonar-scanner-8.1.0.6389-windows-x64\bin\sonar-scanner.bat" `
            "-Dsonar.host.url=http://localhost:9000" `
            "-Dsonar.login=${{ secrets.SONAR_TOKEN }}" `
            "-Dproject.settings=sonar-project.properties"

          
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    
  build:
    runs-on: ubuntu-latest
    needs: sonarqube
    
    env:
      IMAGE_NAME: docker.io/jeevanrana78/enterprise-inventory-app
      IMAGE_TAG: ${{ github.sha }}

# ==========================================================
# Source Control
# - Checkout application source code
# ==========================================================


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5


# ==========================================================
# Quality Gate
# - Dockerfile linting (Hadolint)
# - Dockerfile best practice validation
# ==========================================================



      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Show Runner Information
        run: |
          pwd
          whoami
          docker --version
          php --version

# ==========================================================
# Build
# - Display runner information
# - Build Docker image
# - Create latest and immutable image tags
# - Verify Docker image
# ==========================================================


      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Verify Docker Images
        run: |
          docker images
          docker image inspect ${{ env.IMAGE_NAME }}:latest
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


# ==========================================================
# Security Scanning
# - Trivy vulnerability scan
# - Docker Scout analysis
# - SBOM generation
# - Upload SBOM artifact
# ===========================================================


     
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: 0
          
     #    - name: Docker Scout Scan
        #   uses: docker/scout-action@v1
        #   with:
            # command: quickview
           #  image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json



# ==========================================================
# Publish
# - Docker Hub authentication
# - Push latest image
# - Push immutable Git SHA image
# ==========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==========================================================
# Supply Chain Security
# - Install Cosign
# - Restore signing key
# - Sign container image
# - Verify image signature
# ==========================================================


      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
          
      - name: Restore Cosign Private Key
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

      - name: Sign Docker Image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --key cosign.key \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --yes

      - name: Verify Signature
        run: |
          cosign verify \
            --key security/cosign.pub \
           ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}