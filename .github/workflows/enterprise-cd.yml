# ==============================================================================
# WORKFLOW : Enterprise CD Pipeline - Release
#
# PURPOSE
#   Build, publish and prepare a production release after code
#   has been merged into the main branch.
#
# RESPONSIBILITIES
#   - Checkout application source code
#   - Build production Docker image
#   - Publish Docker image to Docker Hub
#   - Sign container image using Cosign
#   - Update GitOps repository
#
# THIS WORKFLOW DOES NOT
#   - Run code quality validation
#   - Run Dockerfile linting
#   - Perform vulnerability scanning
#   - Generate SBOM
#
# TRIGGER
#   - Executes after Pull Request merge into main
#
# REPOSITORY
#   enterprise-inventory-app
# ==============================================================================

name: Enterprise CD Pipeline - Release

on:
  push:
    branches:
      - main

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  release:

    name: Build, Publish and Prepare GitOps Release

    runs-on: ubuntu-latest

    env:

      IMAGE_NAME: docker.io/jeevanrana78/enterprise-inventory-app

      RELEASE_VERSION: v0.0.2

    steps:

# ==============================================================================
# SOURCE CONTROL
#
# Checkout latest application source.
# ==============================================================================

      - name: Checkout Repository
        uses: actions/checkout@v5

# ==============================================================================
# GENERATE IMAGE TAG
#
# Create immutable image tag using Git Commit SHA.
#
# Example
#
# IMAGE_TAG=f2c32c36
# DEPLOY_BRANCH=deploy/f2c32c36
# ==============================================================================

      - name: Generate Image Tag

        run: |

          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

          echo "DEPLOY_BRANCH=deploy/${GITHUB_SHA::8}" >> $GITHUB_ENV

# ==============================================================================
# BUILD DOCKER IMAGE
#
# Every GitHub runner is ephemeral.
# Therefore the image must be rebuilt for every release.
# ==============================================================================

      - name: Build Docker Image

        working-directory: backend

        run: |

          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

# ==============================================================================
# VERIFY DOCKER IMAGE
#
# Ensure images were created successfully.
# ==============================================================================

      - name: Verify Docker Images

        run: |

          docker images

          docker image inspect ${{ env.IMAGE_NAME }}:latest

          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==============================================================================
# LOGIN TO DOCKER HUB
#
# Authenticate before publishing images.
# ==============================================================================

      - name: Login to Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKER_USERNAME }}

          password: ${{ secrets.DOCKER_TOKEN }}

# ==============================================================================
# PUSH DOCKER IMAGES
#
# Publish
#
# latest
# release version
# immutable git sha
# ==============================================================================

      - name: Push Docker Images

        run: |

          docker push ${{ env.IMAGE_NAME }}:latest

          docker push ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}

          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==============================================================================
# INSTALL COSIGN
# ==============================================================================

      - name: Install Cosign

        uses: sigstore/cosign-installer@v3

# ==============================================================================
# RESTORE COSIGN PRIVATE KEY
# ==============================================================================

      - name: Restore Cosign Private Key

        run: |

          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

# ==============================================================================
# SIGN CONTAINER IMAGE
# ==============================================================================

      - name: Sign Docker Image

        env:

          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

        run: |

          cosign sign \
            --key cosign.key \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --yes

# ==============================================================================
# VERIFY IMAGE SIGNATURE
# ==============================================================================

      - name: Verify Image Signature

        run: |

          cosign verify \
            --key security/cosign.pub \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==============================================================================
# GITOPS REPOSITORY
#
# Clone the GitOps repository and prepare a deployment branch.
# ==============================================================================

      - name: Clone GitOps Repository

        run: |

          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ranajeevan-lab/enterprise-inventory-gitops.git

# ==============================================================================
# CHECKOUT DEPLOYMENT BRANCH
#
# Create or switch to deployment branch.
# ==============================================================================

      - name: Checkout Deployment Branch

        run: |

          cd enterprise-inventory-gitops

          git checkout -B ${{ env.DEPLOY_BRANCH }}

# ==============================================================================
# CONFIGURE GIT
#
# Configure GitHub Actions identity.
# ==============================================================================

      - name: Configure Git

        run: |

          cd enterprise-inventory-gitops

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

# ==============================================================================
# UPDATE HELM VALUES
#
# Update the immutable Docker image tag inside values.yaml.
# ==============================================================================

      - name: Update Helm Image Tag

        run: |

          cd enterprise-inventory-gitops

          sed -i "s|tag: \".*\"|tag: \"${{ env.IMAGE_TAG }}\"|g" \
            enterprise-inventory/values.yaml

# ==============================================================================
# VERIFY UPDATED VALUES
# ==============================================================================

      - name: Verify Updated values.yaml

        run: |

          cd enterprise-inventory-gitops

          grep "tag:" enterprise-inventory/values.yaml

# ==============================================================================
# COMMIT GITOPS CHANGES
#
# Commit only when values.yaml has changed.
# ==============================================================================

      - name: Commit GitOps Changes

        run: |

          cd enterprise-inventory-gitops

          git add enterprise-inventory/values.yaml

          git commit -m "chore(gitops): deploy image ${{ env.IMAGE_TAG }}" || echo "No changes to commit"

# ==============================================================================
# PUSH DEPLOYMENT BRANCH
# ==============================================================================

      - name: Push Deployment Branch

        run: |

          cd enterprise-inventory-gitops

          git push --set-upstream origin ${{ env.DEPLOY_BRANCH }}

# ==============================================================================
# VERIFY GITHUB CLI AUTHENTICATION (Temporary Debug Step)
# ==============================================================================

      - name: Verify GitHub CLI Authentication

        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}

        run: |

          gh auth status

# ==============================================================================
# CREATE GITOPS PULL REQUEST
# ==============================================================================

      - name: Create GitOps Pull Request

        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}

        run: |

          cd enterprise-inventory-gitops

          gh pr create \
            --repo ranajeevan-lab/enterprise-inventory-gitops \
            --base main \
            --head ${{ env.DEPLOY_BRANCH }} \
            --title "Deploy image ${{ env.IMAGE_TAG }}" \
            --body "Automated GitOps deployment for image ${{ env.IMAGE_TAG }}"