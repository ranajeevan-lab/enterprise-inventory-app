# ==============================================================================
# WORKFLOW : Enterprise CD Pipeline - Release
#
# PURPOSE
#   Build, publish and prepare a production release after code
#   has been merged into the main branch.
#
# RESPONSIBILITIES
#   - Checkout application source code
#   - Build production Docker image
#   - Publish Docker image to Docker Hub
#   - Sign container image using Cosign
#   - Trigger GitOps deployment workflow
#
# THIS WORKFLOW DOES NOT
#   - Run code quality validation
#   - Run Dockerfile linting
#   - Perform vulnerability scanning
#   - Generate SBOM
#
# TRIGGER
#   - Push to the main branch
#   - Starts only after a Pull Request has been merged
#
# REPOSITORY
#   enterprise-inventory-app
# ==============================================================================

name: Enterprise CD Pipeline - Release

on:
  push:
    branches:
      - main

# ==============================================================================
# PERMISSIONS
#
# PURPOSE
# Apply the Principle of Least Privilege.
# ==============================================================================

permissions:
  contents: read
  actions: read

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  release:

    name: Build and Release Container

    runs-on: ubuntu-latest

    # ==========================================================================
    # ENVIRONMENT VARIABLES
    #
    # PURPOSE
    # Store reusable workflow variables.
    #
    # NOTE
    # IMAGE_TAG and DEPLOY_BRANCH are generated dynamically.
    # ==========================================================================

    env:
      IMAGE_NAME: docker.io/jeevanrana78/enterprise-inventory-app
      RELEASE_VERSION: v0.0.2

    steps:

    # ==========================================================================
    # Checkout Repository
    #
    # PURPOSE
    # Retrieve the latest application source code.
    # ==========================================================================

    - name: Checkout Repository
      uses: actions/checkout@v5

    # ==========================================================================
    # Generate Image Tag
    #
    # PURPOSE
    # Create immutable deployment variables.
    #
    # OUTPUT
    # IMAGE_TAG
    # DEPLOY_BRANCH
    # ==========================================================================

    - name: Generate Image Tag
      run: |
        echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
        echo "DEPLOY_BRANCH=deploy/${GITHUB_SHA::8}" >> $GITHUB_ENV

    # ==========================================================================
    # Docker Build
    #
    # PURPOSE
    # Build a production Docker image.
    #
    # OUTPUT
    # latest
    # release version
    # immutable Git SHA image
    # ==========================================================================

    - name: Build Docker Image
      working-directory: backend
      run: |
        docker build \
          -t ${{ env.IMAGE_NAME }}:latest \
          -t ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} \
          -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

    # ==========================================================================
    # Verify Docker Images
    #
    # PURPOSE
    # Ensure all image tags were created successfully.
    # ==========================================================================

    - name: Verify Docker Images
      run: |
        docker images
        docker image inspect ${{ env.IMAGE_NAME }}:latest
        docker image inspect ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
        docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # ==========================================================================
    # Docker Hub Login
    #
    # PURPOSE
    # Authenticate with Docker Hub.
    # ==========================================================================

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    # ==========================================================================
    # Publish Docker Images
    #
    # PURPOSE
    # Push mutable and immutable images.
    # ==========================================================================

    - name: Push Docker Images
      run: |
        docker push ${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
        docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # ==========================================================================
    # Install Cosign
    #
    # PURPOSE
    # Install Sigstore Cosign.
    # ==========================================================================

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3

    # ==========================================================================
    # Restore Cosign Private Key
    #
    # PURPOSE
    # Restore signing key from GitHub Secrets.
    # ==========================================================================

    - name: Restore Cosign Private Key
      run: |
        echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

    # ==========================================================================
    # Sign Docker Image
    #
    # PURPOSE
    # Sign the immutable production image.
    # ==========================================================================

    - name: Sign Docker Image
      env:
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      run: |
        cosign sign \
          --key cosign.key \
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          --yes

    # ==========================================================================
    # Verify Docker Signature
    #
    # PURPOSE
    # Verify the published image signature.
    # ==========================================================================

    - name: Verify Image Signature
      run: |
        cosign verify \
          --key security/cosign.pub \
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # ==========================================================================
    #
    # PURPOSE
    # Trigger the reusable GitOps workflow.
    #
    # RESPONSIBILITY
    # The reusable workflow performs:
    #   - Clone GitOps repository
    #   - Checkout deployment branch
    #   - Update Helm values.yaml
    #   - Commit changes
    #   - Push deployment branch
    #   - Create Pull Request
    #
    # BENEFITS
    #   - Separation of concerns
    #   - Reusable across applications
    #   - Easier maintenance
    # ==========================================================================

    - name: Trigger GitOps Deployment

      uses: ./.github/workflows/gitops-pr.yml

      with:

        application_name: enterprise-inventory-app

        image_name: ${{ env.IMAGE_NAME }}

        image_tag: ${{ env.IMAGE_TAG }}

        gitops_owner: ranajeevan-lab

        gitops_repository: enterprise-inventory-gitops

        deploy_branch: ${{ env.DEPLOY_BRANCH }}

        values_file: enterprise-inventory/values.yaml

        base_branch: main

      secrets:

        GITOPS_PAT: ${{ secrets.GITOPS_PAT }}