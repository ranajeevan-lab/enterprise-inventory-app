# ==============================================================================
# WORKFLOW : Enterprise CD Pipeline - Release
#
# PURPOSE
#   Build, publish and prepare a production release after code
#   has been merged into the main branch.
#
# RESPONSIBILITIES
#   - Checkout application source code
#   - Build production Docker image
#   - Publish Docker image to Docker Hub
#   - Sign container image using Cosign
#   - Update GitOps repository
#
# THIS WORKFLOW DOES NOT
#   - Run code quality validation
#   - Run Dockerfile linting
#   - Perform vulnerability scanning
#   - Generate SBOM
#
# TRIGGER
#   - Push to the main branch
#   - Starts only after a Pull Request has been merged
#
# REPOSITORY
#   enterprise-inventory-app
# ==============================================================================

name: Enterprise CD Pipeline - Release

on:
  push:
    branches:
      - main

# ==============================================================================
# JOBS
# ==============================================================================

jobs:

  release:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: docker.io/jeevanrana78/enterprise-inventory-app
      RELEASE_VERSION: v0.0.2

    steps:

# ==========================================================
# Source Control
# PURPOSE
# Retrieve the latest application source code.
# ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Image Tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

# ==========================================================
# Build
# PURPOSE
# Build a fresh production Docker image.
# Every GitHub Actions workflow runs on a new runner,
# therefore the image must be rebuilt.
# ==========================================================

      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }} \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Verify Docker Images
        run: |
          docker images
          docker image inspect ${{ env.IMAGE_NAME }}:latest
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          docker image inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==========================================================
# Publish
# PURPOSE
# Authenticate with Docker Hub and publish both
# the mutable (latest) and immutable (Git SHA) images.
# ==========================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==========================================================
# Supply Chain Security
# PURPOSE
# Sign the published container image and verify the signature.
# This guarantees image integrity before deployment.
# ==========================================================

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Restore Cosign Private Key
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key

      - name: Sign Docker Image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign \
            --key cosign.key \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --yes

      - name: Verify Image Signature
        run: |
          cosign verify \
            --key security/cosign.pub \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

# ==========================================================
# GitOps Repository
# PURPOSE
# Clone the GitOps repository and switch to the deployment
# branch where deployment changes are prepared.
# ==========================================================

      - name: Clone GitOps Repository
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ranajeevan-lab/enterprise-inventory-gitops.git

      - name: Checkout GitOps Branch
        run: |
          cd enterprise-inventory-gitops
          git checkout feature/deploy

      - name: Verify GitOps Repository
        run: |
          ls -la enterprise-inventory-gitops


# ==========================================================
# GitOps Update
# PURPOSE
# Update the Helm values file with the newly published
# immutable Docker image tag.
#
# Modify this file:
# enterprise-inventory-gitops/
# └── enterprise-inventory/
#     └── values.yaml
# ==========================================================

      - name: Update Helm Image Tag
        run: |
          sed -i 's|tag: ".*"|tag: "${{ env.IMAGE_TAG }}"|' \
            enterprise-inventory-gitops/enterprise-inventory/values.yaml

      - name: Verify Updated values.yaml
        run: |
          grep 'tag:' enterprise-inventory-gitops/enterprise-inventory/values.yaml

# ==========================================================
# GitOps Commit
# PURPOSE
# Commit deployment configuration changes.
# ==========================================================

      - name: Configure Git
        run: |
          cd enterprise-inventory-gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit GitOps Changes
        run: |
          cd enterprise-inventory-gitops
          git add .
          git commit -m "chore(gitops): update image tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"

# ==========================================================
# GitOps Push
# PURPOSE
# Push deployment changes to the feature/deploy branch.
# ==========================================================

      - name: Push GitOps Changes
        run: |
          cd enterprise-inventory-gitops
          git push origin feature/deploy

# ==========================================================
# GitOps Pull Request
# PURPOSE
# Create a Pull Request from feature/deploy to main.
#
# NOTE
# This section will be implemented in Lesson 11 using
# the GitHub CLI (gh).
# ==========================================================

